name: Signal scan

# Calls the deployed app, which runs the signal pipeline and sends a Telegram alert when the rules pass.
# Add two repository secrets: APP_URL (e.g. https://your-app.vercel.app, no trailing slash) and CRON_SECRET.
on:
  schedule:
    - cron: "*/15 * * * 1-5" # day mode, every 15 minutes
    - cron: "5 * * * 1-5" # swing mode, hourly
  workflow_dispatch:
    inputs:
      mode:
        description: "Mode to scan"
        required: true
        default: day
        type: choice
        options: [day, swing]

permissions: {}

jobs:
  day:
    if: github.event_name == 'schedule' && github.event.schedule == '*/15 * * * 1-5' || github.event_name == 'workflow_dispatch' && inputs.mode == 'day'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Scan (day)
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl -fsS -X POST "$APP_URL/api/cron/scan?mode=day" \
            -H "Authorization: Bearer $CRON_SECRET" \
            --max-time 30 --retry 1

  swing:
    if: github.event_name == 'schedule' && github.event.schedule == '5 * * * 1-5' || github.event_name == 'workflow_dispatch' && inputs.mode == 'swing'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Scan (swing)
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl -fsS -X POST "$APP_URL/api/cron/scan?mode=swing" \
            -H "Authorization: Bearer $CRON_SECRET" \
            --max-time 30 --retry 1
